# /etc/nginx/conf.d/pl-admin-api.conf
# TLS blocks are written by certbot: run
#   sudo certbot --nginx -d api.pratyushfitness.edastra.in

server {
    listen 80;
    server_name api.pratyushfitness.edastra.in;

    # Image uploads arrive as base64 JSON, so allow a little headroom.
    client_max_body_size 16m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
