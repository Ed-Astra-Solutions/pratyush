<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pratyush Liftz — Admin</title>
<link rel="icon" href="/favicon-48.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Login gate. The password is only ever checked by the EC2 backend;
     this page is public static hosting and holds no secrets. -->
<div class="login" id="login">
  <form class="login-card" id="login-form">
    <h1>Pratyush<b style="color:var(--yellow)">&nbsp;Liftz</b></h1>
    <p>Content console. Sign in to edit the site.</p>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p id="login-err" class="hidden" style="color:var(--red);margin:12px 0 0"></p>
    <button class="btn" style="width:100%;justify-content:center;margin-top:18px" type="submit" id="login-btn">Sign in</button>
  </form>
</div>

<div class="shell hidden" id="shell">
  <aside class="side">
    <div class="brand">Pratyush<b>Liftz</b></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="last-saved">—</div>
      <button class="btn ghost tiny" style="margin-top:12px" id="logout">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h2 id="section-title">Content</h2>
      <span class="pill" id="status">Loaded</span>
      <a class="btn ghost tiny" id="view-site" target="_blank" rel="noopener">View site</a>
      <button class="btn" id="save" disabled>Save &amp; publish</button>
    </header>
    <div class="body" id="panel"></div>
  </main>
</div>

<script src="config.js"></script>
<script src="schema.js"></script>
<script src="app.js"></script>
</body>
</html>
