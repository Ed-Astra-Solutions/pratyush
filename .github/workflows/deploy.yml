name: Build & deploy site

# Any content commit from the admin console lands on main and lands here.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'admin/**'
      - 'build/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:          # "Trigger rebuild" button in the console
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments race; queue instead of cancelling so a
# content save is not dropped by a later one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The application form is the site's only conversion path, so a content
      # change that breaks it must not reach production.
      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Test the application form
        run: npm test

      - name: Build site
        env:
          PL_API_BASE: ${{ vars.PL_API_BASE }}
        run: node build/build.mjs build

      - name: Show what was built
        run: |
          echo "content updated: $(node -p "require('./dist/build.json').contentUpdatedAt")"
          du -sh dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
